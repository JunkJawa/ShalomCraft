name: Build ShalomCraft

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Build
        run: gradle build --no-daemon

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: shalomcraft-jar
          path: build/libs/*.jar

      - name: Publish releases
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(grep '^mod_version=' gradle.properties | cut -d= -f2)
          JAR="build/libs/shalomcraft-${VERSION}.jar"
          # "latest" always points at the newest build of main
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest "$JAR" \
            --title "ShalomCraft (latest build, v${VERSION})" \
            --notes "Automatic build of the newest commit, version ${VERSION}. Install this jar on the server and on every client." \
            --target "${{ github.sha }}"
          # each new version number also gets its own permanent release
          if ! gh release view "v${VERSION}" > /dev/null 2>&1; then
            gh release create "v${VERSION}" "$JAR" \
              --title "ShalomCraft v${VERSION}" \
              --notes-file CHANGELOG.md \
              --latest=false \
              --target "${{ github.sha }}"
          fi
